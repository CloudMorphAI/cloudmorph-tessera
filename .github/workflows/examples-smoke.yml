name: examples-smoke

on:
  push:
  pull_request:

jobs:
  external-client:
    name: External client credential-free boundaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install local runtime and focused check dependencies
        run: pip install -e '.[runtime]' pytest==9.0.3 ruff==0.15.12
      - name: Check auth, policy and forwarding boundaries without credentials
        run: python -m pytest -q tests/test_external_client_demo.py
      - name: Lint external client example
        run: ruff check examples/external_client_demo tests/test_external_client_demo.py

  post-call:
    name: Post-call synthetic checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install local runtime and focused check dependencies
        run: pip install -e '.[runtime,intelligence]' pytest==9.0.3 jsonschema==4.23.0 ruff==0.15.12
      - name: Check actual policy gate and mocked model workflow
        run: |
          python -m pytest -q examples/post_call_demo/policy_tests.py
          python -m unittest -v examples.post_call_demo.model_tests
          node --test examples/post_call_demo/backend/tests/fixture.test.mjs
          python examples/post_call_demo/verification/verify_http.py
      - name: Lint and parse local demo sources
        run: |
          ruff check examples/post_call_demo
          node --check examples/post_call_demo/web/app.js
          node --check examples/post_call_demo/verification/capture_ui.mjs

  validate:
    name: Validate ${{ matrix.example }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - wrap_anthropic_sdk
          - wrap_openai_sdk
          - wrap_langchain
          - wrap_claude_code
          - wrap_vscode_copilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tessera (runtime extras only)
        run: pip install -e .[runtime]

      - name: Validate policy YAML
        run: |
          python -c "
          import yaml, sys
          path = 'examples/${{ matrix.example }}/policies/block-destructive-issues.yaml'
          with open(path) as f:
              doc = yaml.safe_load(f)
          required = {'id', 'name', 'action'}
          missing = required - doc.keys()
          if missing:
              print(f'FAIL: missing keys {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'OK  policy parsed: {doc[\"id\"]}')
          "

      - name: Validate tessera config YAML
        run: |
          python -c "
          import yaml, sys
          path = 'examples/${{ matrix.example }}/tessera.example.yaml'
          with open(path) as f:
              doc = yaml.safe_load(f)
          required = {'policies', 'auth', 'upstreams'}
          missing = required - doc.keys()
          if missing:
              print(f'FAIL: missing keys {missing}', file=sys.stderr)
              sys.exit(1)
          print(f'OK  tessera config parsed, mode={doc[\"policies\"][\"mode\"]}')
          "

      - name: AST-parse Python files
        run: |
          found=0
          for f in examples/${{ matrix.example }}/*.py; do
            [ -f "$f" ] || continue
            python -c "import ast; ast.parse(open('$f').read())"
            echo "OK  $f"
            found=1
          done
          [ "$found" -eq 0 ] && echo "No .py files in examples/${{ matrix.example }}/ (skipped)"
          exit 0
