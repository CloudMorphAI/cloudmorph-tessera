framework: "EU AI Act"
version: "obligations applicable 2026-08-02 (Title III high-risk AI system requirements, Regulation (EU) 2024/1689)"

# Scope note: these obligations apply to the *AI system* as a whole. Tessera sits
# at the MCP tool-call boundary of an agentic AI system — it does not see, and
# cannot evidence, anything about the underlying model's reasoning, training, or
# behavior outside a mediated tool call. Every entry below is scoped accordingly;
# read `evidenced_by` for exactly what is and is not covered.

obligations:
  - id: automatic-event-logging
    obligation: >
      High-risk AI systems must technically support automatic recording of
      events (logs) over the system's lifetime, at a level of detail sufficient
      to trace the system's functioning, identify situations presenting risk,
      and support post-market monitoring and deployer oversight.
    source: "EU AI Act Article 12 (Record-keeping)"
    tessera_controls:
      - "deterministic policy enforcement at the MCP boundary"
      - "SHA-256 hash-chained tamper-evident audit log"
      - "per-decision policy_id + reason recorded"
    evidenced_by: >
      Every tool call Tessera mediates produces one hash-chained event (tool,
      policy_id, reason, action, timestamp) — an automatic, tamper-evident
      event record for the tool-invocation surface of the AI system. This
      covers the MCP tool-call surface only; it does not cover events
      generated by the underlying model outside a mediated tool call.

  - id: provider-log-retention
    obligation: >
      Providers must keep the logs automatically generated by their high-risk
      AI system, to the extent the logs are under their control, for a period
      appropriate to the system's intended purpose and at least six months.
    source: "EU AI Act Article 19 (Automatically generated logs)"
    tessera_controls:
      - "SHA-256 hash-chained tamper-evident audit log"
      - "Ed25519-signed, offline-verifiable evidence export"
    evidenced_by: >
      The audit sink persists every stamped event; retention window is
      operator-configured and not capped by Tessera. `tessera audit export`
      plus the signed evidence export produce a complete, independently
      verifiable record on demand, supporting retention and integrity beyond
      the six-month floor.

  - id: deployer-log-retention
    obligation: >
      Deployers must keep the logs automatically generated by the high-risk AI
      system, to the extent under their control, for a period appropriate to
      the system's intended purpose and at least six months.
    source: "EU AI Act Article 26(6)"
    tessera_controls:
      - "SHA-256 hash-chained tamper-evident audit log"
      - "Ed25519-signed, offline-verifiable evidence export"
    evidenced_by: >
      Identical mechanism to provider-log-retention, applied from the
      deployer's side of the deployment: the deployer runs Tessera at the MCP
      boundary and retains the hash-chained log + signed exports as its record
      of the system's tool-call activity.

  - id: deployer-operation-monitoring
    obligation: >
      Deployers must monitor the operation of the high-risk AI system on the
      basis of the provider's instructions for use.
    source: "EU AI Act Article 26(5)"
    tessera_controls:
      - "deterministic policy enforcement at the MCP boundary (allow/block/require_approval/log_only)"
      - "per-decision policy_id + reason recorded"
      - "Ed25519-signed, offline-verifiable evidence export"
    evidenced_by: >
      Real-time allow/block/require_approval/log_only decisions, plus the
      exportable, signature-verifiable audit trail, give deployers continuous,
      reviewable visibility into tool-call activity — one concrete input into
      the operational monitoring Article 26(5) requires. Tessera does not
      monitor the underlying model's behavior outside tool calls, so this is
      partial evidence for the tool-call surface, not the complete monitoring
      obligation.

  - id: post-market-monitoring-input
    obligation: >
      Providers must establish and document a post-market monitoring system,
      proportionate to the AI technology and its risks, to actively and
      systematically collect and analyze data on the high-risk AI system's
      performance throughout its lifetime.
    source: "EU AI Act Article 72 (post-market monitoring by providers)"
    tessera_controls:
      - "SHA-256 hash-chained tamper-evident audit log"
      - "Ed25519-signed, offline-verifiable evidence export"
      - "per-decision policy_id + reason recorded"
    evidenced_by: >
      Exported audit data (`tessera audit export`, JSONL/CSV) supplies real
      operational decision data for the tool-call surface that a provider's
      post-market monitoring system can ingest. It is one input source
      Tessera can supply; it does not analyze the data or constitute a
      complete post-market monitoring system by itself.

  - id: human-oversight-mechanism
    obligation: >
      High-risk AI systems must be designed so that natural persons can
      effectively oversee them, including the ability to intervene in or
      interrupt the system's operation, or otherwise decide not to use the
      system's output.
    source: "EU AI Act Article 14 (Human oversight)"
    tessera_controls:
      - "deterministic policy enforcement at the MCP boundary (require_approval action)"
      - "SHA-256 hash-chained tamper-evident audit log"
      - "per-decision policy_id + reason recorded"
    evidenced_by: >
      The require_approval policy action halts a matched tool call before
      execution pending explicit human sign-off, and the resulting decision
      (policy_id, reason, timestamp) is written to the tamper-evident log — a
      concrete intervention point for the tool-invocation surface. Tessera
      does not itself capture approver identity; that must come from whatever
      approval workflow the deployer wires to require_approval.
