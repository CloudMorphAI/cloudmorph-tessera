id: aws-mcp-secrets-bulk-read-approval
name: AWS Secrets/Parameter Bulk Read — Require Approval
description: |
  Require human approval for secrets/parameter reads that pull many
  credentials in a single call — the pattern used to exfiltrate an entire
  secrets store rather than the one credential a legitimate task needs:
    1. secretsmanager:BatchGetSecretValue — this API is bulk-by-definition
       (up to 20 secrets per call); any call is gated.
    2. ssm:GetParametersByPath with Recursive=true — walks an entire
       parameter-store subtree (frequently the whole `/` root), returning
       every parameter under it, decrypted if WithDecryption is also set.
    3. ssm:GetParameters with a large `Names` list — a single-secret lookup
       serializes to well under 200 bytes; a Names list that exceeds that
       is a strong signal of a bulk/enumerate-everything read rather than
       a targeted lookup for one task.

  A single GetSecretValue / GetParameter call for a named secret the agent
  needs to complete its task is normal and NOT gated by this policy — the
  vector here is scale, not the act of reading a secret at all. Defaults to
  require_approval (not block) because legitimate bulk-config-bootstrap
  flows exist (e.g., an app fetching its full config tree at startup).
  Tenants who want a hard stop should fork this policy and switch the
  action to block, or tighten the `Names` size threshold.
priority: 90

match:
  upstream: "*"
  tool_pattern: "^aws_(secretsmanager_(BatchGetSecretValue|batch_get_secret_value)|ssm_(GetParametersByPath|get_parameters_by_path|GetParameters|get_parameters))$"

when:
  - condition: any_of
    conditions:
      - condition: tool_name_in
        values:
          - aws_secretsmanager_BatchGetSecretValue
          - aws_secretsmanager_batch_get_secret_value
      - condition: arg_equals
        arg: Recursive
        value: true
      - condition: arg_equals
        arg: Recursive
        value: "true"
      - condition: arg_size_greater_than
        arg: Names
        bytes: 200

action: require_approval
reason: |
  Bulk secret/parameter read is gated for approval. The call either invokes
  secretsmanager:BatchGetSecretValue (inherently bulk), performs a
  recursive ssm:GetParametersByPath walk of a parameter-store subtree, or
  requests an unusually large list of parameter Names in one call. Reading
  many credentials/parameters at once is the pattern used to exfiltrate an
  entire secrets store rather than the single value a task needs. Approve
  via the configured human-approval channel if this bulk read is part of a
  legitimate config-bootstrap flow, or scope the request to the specific
  secret/parameter names required.
